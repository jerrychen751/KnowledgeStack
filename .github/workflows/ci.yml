name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_DIRECT_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder

    steps:
      - name: Retrieve the commit for this event
        uses: actions/checkout@v7

      # This action reads packageManager from the root package.json and selects the pnpm version.
      - name: Configure pnpm
        uses: pnpm/action-setup@v6

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the Prisma schema
        # Run Prisma from the API package directory.
        run: pnpm --filter @knowledgestack/api exec prisma validate --config=prisma.config.ts

      - name: Generate the Prisma Client
        run: pnpm --filter @knowledgestack/api exec prisma generate --config=prisma.config.ts

      # The root typecheck script runs each package typecheck script.
      - name: Perform TypeScript type checks
        run: pnpm typecheck

      - name: Build all packages
        run: pnpm build

  containers:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_USER: knowledgestack
      POSTGRES_PASSWORD: knowledgestack
      POSTGRES_DB: knowledgestack
      TENANT_POSTGRES_USER: tenant1
      TENANT_POSTGRES_PASSWORD: tenant1
      TENANT_POSTGRES_DB: tenant1

    steps:
      - name: Retrieve the commit for this event
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      # AppModule now reaches TokenService and EmbeddingService, and each one throws at construction
      # when its variable is absent. The health routes never decrypt a token or call OpenAI, so a
      # random key and a placeholder string start the container without a repository secret.
      - name: Write the API secrets the container needs to start
        run: |
          node -e "console.log('TOKEN_ENCRYPTION_KEY=' + require('node:crypto').randomBytes(32).toString('base64url'))" > apps/api/.env
          echo "OPENAI_API_KEY=placeholder" >> apps/api/.env

      - name: Validate the full Compose configuration
        run: |
          node scripts/validate-compose-environment.mjs
          docker compose --profile full config --quiet

      - name: Start the full container stack
        run: docker compose --profile full up -d --build --wait

      - name: Check the API liveness route
        run: curl --fail --silent --show-error http://127.0.0.1:3001/health/live

      - name: Check the API readiness route
        run: curl --fail --silent --show-error http://127.0.0.1:3001/health/ready

      - name: Check the web health route
        run: curl --fail --silent --show-error http://127.0.0.1:3000/health

      - name: Check the web-to-API route
        run: >
          docker compose --profile full exec -T web
          node -e
          "fetch(process.env.API_INTERNAL_URL + '/health/ready')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))"

      - name: Stop the full container stack
        if: always()
        run: docker compose --profile full down --volumes --remove-orphans

  publish:
    needs: containers
    # A fork has no right to push to this registry, so the job runs in this repository only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'jerrychen751/KnowledgeStack'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/jerrychen751/knowledgestack

    steps:
      - name: Retrieve the commit for this event
        uses: actions/checkout@v7

      - name: Sign in to the GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      # The commit SHA is the tag, so each push leaves an image that Azure can be pointed at.
      - name: Build the three images
        run: |
          docker build --file apps/api/Dockerfile --target production --tag "$REGISTRY-api:$GITHUB_SHA" .
          docker build --file apps/api/Dockerfile --target migration --tag "$REGISTRY-api-migrate:$GITHUB_SHA" .
          docker build --file apps/web/Dockerfile --target production --tag "$REGISTRY-web:$GITHUB_SHA" .

      - name: Push the three images
        run: |
          docker push "$REGISTRY-api:$GITHUB_SHA"
          docker push "$REGISTRY-api-migrate:$GITHUB_SHA"
          docker push "$REGISTRY-web:$GITHUB_SHA"

  deploy:
    needs: publish
    # The job stays off until the Azure resources exist and docs/azure.md has set this variable.
    if: vars.AZURE_CLIENT_ID != ''
    # Two releases never overlap, or the older one could put its image on the newer one's schema.
    concurrency:
      group: deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Lets the job request the OpenID Connect token that Azure exchanges for a short-lived one. No Azure secret is stored.
      id-token: write
    env:
      REGISTRY: ghcr.io/jerrychen751/knowledgestack
      RESOURCE_GROUP: rg-knowledgestack

    steps:
      - name: Sign in to Azure with the federated identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # A failed migration ends the job here, so api and web keep the previous image.
      - name: Apply pending migrations
        run: |
          az containerapp job update --name api-migrate --resource-group "$RESOURCE_GROUP" --image "$REGISTRY-api-migrate:$GITHUB_SHA"
          execution=$(az containerapp job start --name api-migrate --resource-group "$RESOURCE_GROUP" --query name --output tsv)
          while true; do
            status=$(az containerapp job execution show --name api-migrate --resource-group "$RESOURCE_GROUP" --job-execution-name "$execution" --query properties.status --output tsv)
            echo "api-migrate: $status"
            case "$status" in
              Succeeded) break ;;
              Running | Processing | Unknown) sleep 5 ;;
              *) exit 1 ;;
            esac
          done

      - name: Set the new image on api and web
        run: |
          az containerapp update --name api --resource-group "$RESOURCE_GROUP" --image "$REGISTRY-api:$GITHUB_SHA"
          az containerapp update --name web --resource-group "$RESOURCE_GROUP" --image "$REGISTRY-web:$GITHUB_SHA"
